spring.application.name=rcva-backend
server.port=8080
# Errors raised by Spring MVC itself (unknown path, wrong method...) also as Problem Details
spring.mvc.problemdetails.enabled=true
# Excel uploads (POST /imports/excel); the real files are a few dozen rows
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
